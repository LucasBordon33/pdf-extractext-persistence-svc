name: security-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep security gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Semgrep rules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.semgrep
          key: semgrep-rules-1.182.1-${{ github.run_number }}
          restore-keys: semgrep-rules-1.182.1-
      - name: Install pinned Semgrep
        run: pip install semgrep==1.182.1
      - name: Scan (SARIF + gate)
        run: |
          semgrep scan \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/docker \
            --error \
            --strict \
            --metrics=off \
            --sarif \
            --output semgrep.sarif
      - name: Summarize findings and parse errors
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            jq -r '.runs[0].results[]? | "FINDING \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) - \(.message.text)"' semgrep.sarif
            jq -r '.runs[0].invocations[0].toolExecutionNotifications[]? | "PARSE-ERROR \(.message.text)"' semgrep.sarif
          else
            echo "semgrep.sarif no generado: fallo fatal del scan, revisar el paso anterior"
          fi
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: warn
      - name: Publish to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  hadolint:
    name: Hadolint Dockerfile gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Hadolint
        run: |
          curl --fail --silent --location --output hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" \
            | sha256sum --check
          chmod +x hadolint
      - name: Lint Dockerfile
        run: ./hadolint --failure-threshold warning Dockerfile
