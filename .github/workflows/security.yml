name: security-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semgrep:
    name: Semgrep security gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install pinned Semgrep
        run: pip install semgrep==1.182.1
      - name: Scan (--error --strict)
        run: >-
          semgrep scan
          --config p/secrets
          --config p/owasp-top-ten
          --config p/security-audit
          --config p/docker
          --error --strict --metrics=off

  hadolint:
    name: Hadolint Dockerfile gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Hadolint
        run: |
          curl --fail --silent --location --output hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64"
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" \
            | sha256sum --check
          chmod +x hadolint
      - name: Lint Dockerfile
        run: ./hadolint --failure-threshold warning Dockerfile
