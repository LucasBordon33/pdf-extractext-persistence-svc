name: security-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semgrep:
    name: Semgrep security gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned Semgrep
        run: pip install semgrep==1.182.1
      - name: Scan (--error --strict)
        run: >-
          semgrep scan
          --config p/secrets
          --config p/owasp-top-ten
          --config p/security-audit
          --config p/docker
          --error --strict --metrics=off

  hadolint:
    name: Hadolint Dockerfile gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d --failure-threshold warning - < Dockerfile
